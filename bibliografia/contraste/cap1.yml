capitulo: 1
afirmaciones:
- id: c1-m1-01
  tipo: historica
  afirmacion: 'Snow, Soho 1854: dibuja los muertos en un plano con las bombas'
  hash_texto: 8ca6a275b6cd805b
  veredicto: con-matiz
  nota: 'La p. 261 respalda el núcleo: Snow, Soho, cólera de 1854 y un análisis espacial de los muertos
    frente a las bombas de agua (allí, una teselación de Dirichlet que muestra la cercanía a la bomba
    de Broad Street). NO aparecen en esa página: «poco más de un mes», la teoría del aire viciado (miasma),
    que Snow «sospecha del agua» sin «con qué demostrarlo», ni que mapear «no era un método»; esos elementos
    necesitan otra fuente. Además, Pebesma y Bivand (2023, §15.1) matizan el relato: Snow ya tenía una
    hipótesis firme y el mapa se preparó después de inhabilitar la bomba, como documentación.'
  redactado_por: sesión maestra (Opus 5.5) y, antes, el capítulo original
  verificado_por: verificadores de contexto limpio Sonnet 5.5 y Opus 5.5 (mismo veredicto)
  fecha: 2026-11-12
  fuentes:
  - clave: baddeley2015spatial
    loc: p. 261
    clase: PDF
    pagina_pdf: 280
    cita: people who died in the Soho cholera epidemic of 1854 lived closer to the infected Broad Street
      pump than to any other water pump.
- id: c1-m3-01
  tipo: atribucion
  afirmacion: la primera ley es una cita de Tobler (1970)
  hash_texto: ce646e7e54db4b6f
  veredicto: con-matiz
  nota: El §15.1 reporta la frase de Tobler y la fecha 1970 (Tobler 1970; también vía la cita de Olsson,
    «Tobler (1970, 236)»), y la traducción es fiel. Que sea «la frase más repetida del área» no lo dice
    la fuente; es una valoración del curso sin respaldo en el §15.1.
  redactado_por: sesión maestra (Opus 5.5) y, antes, el capítulo original
  verificado_por: verificadores de contexto limpio Sonnet 5.5 y Opus 5.5 (mismo veredicto)
  fecha: 2026-11-12
  fuentes:
