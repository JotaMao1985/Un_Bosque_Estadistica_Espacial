- id: c1-m12-03
  tipo: atribucion
  afirmacion: llamar «ley» a la de Tobler es prematuro (Olsson, recogido por Pebesma y Bivand)
  hash_texto: 87173ba27c7d542c
  veredicto: respaldada
  nota: El §15.1 recoge la cita de Olsson (1970, p. 228) según la cual elevar la frase de Tobler al rango
    de «primera ley» es, en el mejor caso, prematuro; los autores la suscriben («It is not and has never
    been the case that ... always holds absolutely»). El juicio de «prematuro» es de Olsson, citado por
    Pebesma y Bivand, y el verbo «recogen» lo refleja bien.
  redactado_por: sesión maestra (Opus 5.5) y, antes, el capítulo original
  verificado_por: verificadores de contexto limpio Sonnet 5.5 y Opus 5.5 (mismo veredicto)
