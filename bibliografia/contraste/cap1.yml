    loc: §15.1
    clase: WEB
    instantanea: 15-Measures
    cita: Tobler’s first law of geography, “Everything is related to everything else, but near things
      are more related than distant things”
    segunda_mano_de: tobler1970computer
- id: c1-m3-02
  tipo: definicion
  afirmacion: 'índice de Clark-Evans: R = d̄min/E[d̄min], sin unidades, referencia 1'
  hash_texto: 7e91b429bdcec5d6
  veredicto: respaldada
  nota: La p. 258 define R como la media de las distancias al vecino más cercano dividida entre E[D] =
    1/(2√λ) bajo un proceso de Poisson, la atribuye a Clark y Evans [155], dice que es adimensional y
    que R = 1 corresponde al azar, R > 1 a regularidad y R < 1 a agrupamiento. La fuente usa «suggests»
    (sugiere), y el curso lo enuncia como lectura del cociente, lo que es consistente con la definición.
  redactado_por: sesión maestra (Opus 5.5) y, antes, el capítulo original
  verificado_por: verificadores de contexto limpio Sonnet 5.5 y Opus 5.5 (mismo veredicto)
  fecha: 2026-11-12
  fuentes:
  - clave: baddeley2015spatial
    loc: p. 258
    clase: PDF
    pagina_pdf: 277
    cita: the value R = 1 is consistent with a completely random pattern; R > 1 suggests regularity, while
      R < 1 suggests clustering.
    segunda_mano_de: clark1954distance
